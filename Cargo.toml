[workspace]
resolver = "2"
members = [
    "core",
    "observe-derive",
    "packages/case-runner",
    "packages/terminal-lib",
    "packages/terminals/wt",
    "packages/terminals/zellij",
]
# Tauri 壳（packages/apps/tauri/src-tauri）独立构建：壳重依赖（tauri/windows）不进 workspace 日常编译
exclude = ["packages/apps/tauri/src-tauri"]
